        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }

  /admin/audit-logs:
    get:
      tags: [Administration]
      summary: Search audit logs
      operationId: listAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: action
          in: query
          schema: { type: string }
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAuditLogResponse'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }

components:

  # ===========================================================================
  # SECURITY
  # ===========================================================================

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ===========================================================================
  # PARAMETERS
  # ===========================================================================

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    EventId:
      name: eventId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    TierId:
      name: tierId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    ReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    OrderId:
      name: orderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      description: Number of records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Sort:
      name: sort
      in: query
      description: Spring Data-style sorting expression.
      schema:
        type: string
        example: startDateTime,asc

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key used to make state-changing requests idempotent.
      schema:
        type: string
        maxLength: 128

  # ===========================================================================
  # RESPONSES
  # ===========================================================================

  responses:
    Problem400:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

    Problem401:
      description: Authentication required or invalid credentials
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

    Problem403:
      description: Authenticated but insufficient permissions
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

    Problem404:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

    Problem409:
      description: Conflict with current resource state
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

    Problem410:
      description: Resource or token has expired
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

    Problem422:
      description: Semantically invalid business operation
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  # ===========================================================================
  # SCHEMAS
  # ===========================================================================

  schemas:

    Uuid:
      type: string
      format: uuid
      example: "123e4567-e89b-12d3-a456-426614174000"

    UserRole:
      type: string
      enum: [ROLE_CUSTOMER, ROLE_ORGANIZER, ROLE_ADMIN]

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: SecurePassword123!

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email

    AdminUserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserResponse:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/UserRole' }
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        _links:
          $ref: '#/components/schemas/HalLinks'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

