openapi: 3.0.3

info:
  title: Event & Ticketing Platform API
  description: |
    RESTful API for a complete event and ticket sales platform.
    Supports customer accounts, organizer management, event publishing,
    ticket batches, temporary inventory reservations, checkout, payments,
    refunds, tickets, QR-code check-in, notifications, and administration.

    The API is designed for a Spring Boot monolith using PostgreSQL,
    Spring Data JPA/Hibernate, Spring Security/JWT, Flyway/Liquibase,
    RFC 7807 Problem Details, pagination, sorting, filtering, and HATEOAS.
  version: 1.0.0
  contact:
    name: Enzo Bernardis
    email: enzobernardis2007@gmail.com

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local Development

tags:
  - name: Authentication
  - name: Current User
  - name: Users
  - name: Events
  - name: Ticket Tiers
  - name: Reservations
  - name: Orders
  - name: Payments
  - name: Tickets
  - name: Check-in
  - name: Categories
  - name: Notifications
  - name: Organizer
  - name: Administration
  - name: Webhooks

paths:

  # ===========================================================================
  # AUTHENTICATION
  # ===========================================================================

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer account
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '409': { $ref: '#/components/responses/Problem409' }

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { $ref: '#/components/responses/Problem401' }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh token
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '204': { description: Logged out successfully }
        '401': { $ref: '#/components/responses/Problem401' }

  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202': { description: Reset request accepted }
        '400': { $ref: '#/components/responses/Problem400' }

  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password using a reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204': { description: Password reset successfully }
        '400': { $ref: '#/components/responses/Problem400' }
        '410': { $ref: '#/components/responses/Problem410' }

  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Verify an email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/Problem400' }

  /auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Resend email verification
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202': { description: Verification email queued }
        '400': { $ref: '#/components/responses/Problem400' }

  # ===========================================================================
  # CURRENT USER
  # ===========================================================================

  /me:
    get:
      tags: [Current User]
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Problem401' }

    patch:
      tags: [Current User]
      summary: Update current user's profile
      operationId: updateCurrentUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '409': { $ref: '#/components/responses/Problem409' }

  /me/password:
    put:
      tags: [Current User]
      summary: Change current user's password
      operationId: changePassword
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }

  /me/tickets:
    get:
      tags: [Tickets]
      summary: List tickets owned by the current user
      operationId: listMyTickets
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: eventId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Paginated tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTicketResponse'
        '401': { $ref: '#/components/responses/Problem401' }

  /me/orders:
    get:
      tags: [Orders]
      summary: List orders placed by the current user
      operationId: listMyOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Paginated orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrderResponse'
        '401': { $ref: '#/components/responses/Problem401' }

  # ===========================================================================
  # USERS / ADMINISTRATION
  # ===========================================================================

  /users/organizers:
    post:
      tags: [Users]
      summary: Create an organizer account
      operationId: createOrganizer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Organizer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }

  /users/admins:
    post:
      tags: [Users]
      summary: Create an administrator account
      operationId: createAdmin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }

  /users:
    get:
      tags: [Administration]
      summary: Search users
      operationId: listUsers
      security:
        - BearerAuth: []
      parameters:
        - name: email
          in: query
          schema: { type: string, format: email }
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUserResponse'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Administration]
      summary: Get a user
      operationId: getUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

    patch:
      tags: [Administration]
      summary: Update a user's administrative fields
      operationId: updateUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

    delete:
      tags: [Administration]
      summary: Soft-delete a user
      operationId: deleteUser
      security:
        - BearerAuth: []
      responses:
        '204': { description: User deactivated }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

  # ===========================================================================
  # EVENT CATALOG
  # ===========================================================================

  /events:
    get:
      tags: [Events]
      summary: Search and browse published events
      operationId: listEvents
      parameters:
        - name: q
          in: query
          description: Full-text search over event title and description.
          schema: { type: string }
        - name: categoryId
          in: query
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: city
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: startDateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: startDateTo
          in: query
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: minPrice
          in: query
          schema: { type: number, format: double, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, format: double, minimum: 0 }
        - name: availableOnly
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Paginated events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageEventResponse'

    post:
      tags: [Events]
      summary: Create a draft event
      operationId: createEvent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Draft event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }

  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Get event details
      operationId: getEvent
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '404': { $ref: '#/components/responses/Problem404' }

    patch:
      tags: [Events]
      summary: Update an event
      operationId: updateEvent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdateRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }

    delete:
      tags: [Events]
      summary: Cancel or soft-delete an event
      operationId: deleteEvent
      security:
        - BearerAuth: []
      responses:
        '204': { description: Event cancelled }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }

  /events/{eventId}/publish:
    post:
      tags: [Events]
      summary: Publish an event
      operationId: publishEvent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }

  /events/{eventId}/unpublish:
    post:
      tags: [Events]
      summary: Unpublish an event
      operationId: unpublishEvent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event unpublished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }

  /events/{eventId}/cancel:
    post:
      tags: [Events]
      summary: Cancel an event
      operationId: cancelEvent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCancellationRequest'
      responses:
        '200':
          description: Event cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailResponse'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }

  /events/{eventId}/tickets:
    get:
      tags: [Ticket Tiers]
      summary: List ticket tiers for an event
      operationId: listEventTicketTiers
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Ticket tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketTierResponse'
        '404': { $ref: '#/components/responses/Problem404' }

    post:
      tags: [Ticket Tiers]
      summary: Create a ticket tier
      operationId: createTicketTier
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTierRequest'
      responses:
        '201':
          description: Ticket tier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTierResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '409': { $ref: '#/components/responses/Problem409' }

  /events/{eventId}/tickets/{tierId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/TierId'
    get:
      tags: [Ticket Tiers]
      summary: Get a ticket tier
      operationId: getTicketTier
      responses:
        '200':
          description: Ticket tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTierResponse'
        '404': { $ref: '#/components/responses/Problem404' }

    patch:
      tags: [Ticket Tiers]
      summary: Update a ticket tier
      operationId: updateTicketTier
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketTierUpdateRequest'
      responses:
        '200':
          description: Ticket tier updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTierResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }

    delete:
      tags: [Ticket Tiers]
      summary: Disable a ticket tier
      operationId: deleteTicketTier
      security:
        - BearerAuth: []
      responses:
        '204': { description: Ticket tier disabled }
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }

  # ===========================================================================
  # RESERVATIONS
  # ===========================================================================

  /reservations:
    post:
      tags: [Reservations]
      summary: Hold tickets temporarily
      description: |
        Creates a temporary inventory hold. The default reservation TTL is
        10 minutes. Inventory must be atomically decremented/locked so that
        concurrent buyers cannot oversell a ticket tier.
      operationId: createReservation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '409':
          description: Insufficient inventory or reservation conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422': { $ref: '#/components/responses/Problem422' }

  /reservations/{reservationId}:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags: [Reservations]
      summary: Get reservation details
      operationId: getReservation
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }

  /reservations/{reservationId}/cancel:
    post:
      tags: [Reservations]
      summary: Cancel an active reservation
      operationId: cancelReservation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '204': { description: Reservation cancelled and inventory released }
        '401': { $ref: '#/components/responses/Problem401' }
        '404': { $ref: '#/components/responses/Problem404' }
        '409': { $ref: '#/components/responses/Problem409' }

  # ===========================================================================
  # ORDERS / CHECKOUT
  # ===========================================================================

  /orders/checkout:
    post:
      tags: [Orders]
      summary: Convert a reservation into an order
      description: |
        Validates the reservation, creates the order and payment attempt,
        and changes the inventory state from held to sold only after
        successful payment according to the configured payment flow.
      operationId: checkout
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created and payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        '400': { $ref: '#/components/responses/Problem400' }
        '401': { $ref: '#/components/responses/Problem401' }
        '409': { $ref: '#/components/responses/Problem409' }
        '422': { $ref: '#/components/responses/Problem422' }

  /orders:
    get:
      tags: [Orders]
      summary: List orders for the current user
      operationId: listOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: createdFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageOrderResponse'
        '401': { $ref: '#/components/responses/Problem401' }

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: Get order details
      operationId: getOrder
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401': { $ref: '#/components/responses/Problem401' }
        '403': { $ref: '#/components/responses/Problem403' }
        '404': { $ref: '#/components/responses/Problem404' }

  /orders/{orderId}/cancel:
    post:
