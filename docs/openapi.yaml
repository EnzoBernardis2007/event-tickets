        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        salesStartAt: { type: string, format: date-time }
        salesEndAt: { type: string, format: date-time }
        maxTicketsPerCustomer:
          type: integer
          minimum: 1

