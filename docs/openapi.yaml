  # ===========================================================================
  # WEBHOOKS
  # ===========================================================================

  /webhooks/payments:
    post:
      tags: [Webhooks]
      summary: Receive payment provider webhook
      description: |
        Public callback consumed by the payment provider. Authentication is
        performed using the provider's webhook signature rather than JWT.
        Processing must be idempotent using the provider event ID.
      operationId: receivePaymentWebhook
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
        - name: X-Webhook-Id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
