          minimum: 0
        totalCapacity:
          type: integer
          minimum: 1
        salesStartAt:
          type: string
          format: date-time
        salesEndAt:
          type: string
          format: date-time
        maxPerCustomer:
          type: integer
          minimum: 1

    TicketTierResponse:
      type: object
