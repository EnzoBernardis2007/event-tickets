        '403': { $ref: '#/components/responses/Problem403' }

  /admin/orders/{orderId}/refund:
    post:
      tags: [Administration]
      summary: Force or approve an order refund
      operationId: adminRefundOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefundRequest'
      responses:
